<!-- SM4 国密对称加密 -->
<div id="sm4" class="tab-content">
    <div class="section">
        <div class="title">SM4 国密分组密码</div>

        <div class="row">
            <div class="col" style="max-width:140px;">
                <div class="label">加密模式</div>
                <select id="sm4Mode">
                    <option value="ecb">ECB</option>
                    <option value="cbc">CBC</option>
                    <option value="ofb">OFB</option>
                    <option value="cfb">CFB</option>
                    <option value="ctr">CTR</option>
                </select>
            </div>
            <div class="col" style="max-width:140px;">
                <div class="label">填充方式</div>
                <select id="sm4Padding">
                    <option value="pkcs7">PKCS#7</option>
                    <option value="none">None</option>
                </select>
            </div>
            <div class="col" style="max-width:140px;">
                <div class="label">输入模式</div>
                <select id="sm4InputMode">
                    <option value="utf8">UTF-8 文本</option>
                    <option value="hex">HEX 模式</option>
                    <option value="base64">Base64 模式</option>
                    <option value="file">二进制文件模式</option>
                </select>
            </div>
        </div>

        <div id="sm4InputArea" style="display: block;">
            <div class="label">输入数据</div>
            <textarea id="sm4Input" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
        </div>
        <div id="sm4FileArea" style="display: none;">
            <div class="label">选择二进制文件</div>
            <input type="file" id="sm4FileInput" class="file-input" />
            <div class="file-hint">读取原始二进制数据</div>
        </div>

        <div class="label">密钥 (HEX) → 必须 32 位 (128-bit)</div>
        <input id="sm4Key" spellcheck="false" autocorrect="off" autocapitalize="off" value="0123456789abcdeffedcba9876543210">
        <div class="error-hint" id="sm4KeyError"></div>

        <div id="sm4IvArea" style="display: none;">
            <div class="label">IV (HEX) → 必须 32 位 (ECB 模式除外)</div>
            <input id="sm4Iv" spellcheck="false" autocorrect="off" autocapitalize="off" value="0123456789abcdeffedcba9876543210">
        </div>

        <div class="btn-group">
            <button class="btn btn-success" onclick="doSm4Enc()">加密</button>
            <button class="btn btn-danger" onclick="doSm4Dec()">解密</button>
            <button class="btn" onclick="downloadSm4Bin('sm4Result.bin')">下载输出结果Bin</button>
        </div>
        <div class="result" id="sm4Result"></div>
    </div>
</div>

<script>
var sm4BinaryResult = null;

document.addEventListener('DOMContentLoaded', function() {
    const sm4ModeEl = document.getElementById('sm4Mode');
    const sm4IvArea = document.getElementById('sm4IvArea');
    if (sm4ModeEl && sm4IvArea) {
        sm4ModeEl.addEventListener('change', function() {
            sm4IvArea.style.display = this.value === 'ecb' ? 'none' : 'block';
        });
    }
    const sm4InputMode = document.getElementById('sm4InputMode');
    const sm4InputArea = document.getElementById('sm4InputArea');
    const sm4FileArea = document.getElementById('sm4FileArea');
    if (sm4InputMode && sm4InputArea && sm4FileArea) {
        sm4InputMode.addEventListener('change', function() {
            if (this.value === 'file') {
                sm4InputArea.style.display = 'none';
                sm4FileArea.style.display = 'block';
            } else {
                sm4InputArea.style.display = 'block';
                sm4FileArea.style.display = 'none';
            }
        });
    }
});

function _utf8ToHex(str) {
    const arr = [];
    for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i);
        if (code < 0x80) {
            arr.push(code);
        } else if (code < 0x800) {
            arr.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f));
        } else if (code < 0xd800 || code >= 0xe000) {
            arr.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
        } else {
            i++;
            const c = 0x10000 + ((code & 0x3ff) << 10) + (str.charCodeAt(i) & 0x3ff);
            arr.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 0x3f), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
        }
    }
    return arr.map(b => b.toString(16).padStart(2, '0')).join('');
}

function _hexToUtf8(hex) {
    const bytes = hex.match(/.{2}/g) || [];
    const arr = bytes.map(b => parseInt(b, 16));
    let str = '';
    let i = 0;
    while (i < arr.length) {
        const b = arr[i];
        let code;
        if (b < 0x80) {
            code = b; i += 1;
        } else if (b < 0xe0) {
            code = ((b & 0x1f) << 6) | (arr[i + 1] & 0x3f); i += 2;
        } else if (b < 0xf0) {
            code = ((b & 0x0f) << 12) | ((arr[i + 1] & 0x3f) << 6) | (arr[i + 2] & 0x3f); i += 3;
        } else {
            code = ((b & 0x07) << 18) | ((arr[i + 1] & 0x3f) << 12) | ((arr[i + 2] & 0x3f) << 6) | (arr[i + 3] & 0x3f); i += 4;
        }
        str += String.fromCodePoint(code);
    }
    return str;
}

function _hexToBase64(hex) {
    const bytes = hex.match(/.{2}/g) || [];
    const binary = String.fromCharCode(...bytes.map(b => parseInt(b, 16)));
    return btoa(binary);
}

function _base64ToHex(b64) {
    const binary = atob(b64);
    let hex = '';
    for (let i = 0; i < binary.length; i++) {
        hex += binary.charCodeAt(i).toString(16).padStart(2, '0');
    }
    return hex;
}

function _hexToStr(hex) {
    const bytes = hex.match(/.{2}/g) || [];
    return String.fromCharCode(...bytes.map(b => parseInt(b, 16)));
}

function _strToHex(str) {
    let hex = '';
    for (let i = 0; i < str.length; i++) {
        hex += str.charCodeAt(i).toString(16).padStart(2, '0');
    }
    return hex;
}

/* SM4 原生实现，覆盖 ECB/CBC/CFB/OFB/CTR 全部 5 种模式 */

var _sm4Sbox = [
    0xd6,0x90,0xe9,0xfe,0xcc,0xe1,0x3d,0xb7,0x16,0xb6,0x14,0xc2,0x28,0xfb,0x2c,0x05,
    0x2b,0x67,0x9a,0x76,0x2a,0xbe,0x04,0xc3,0xaa,0x44,0x13,0x26,0x49,0x86,0x06,0x99,
    0x9c,0x42,0x50,0xf4,0x91,0xef,0x98,0x7a,0x33,0x54,0x0b,0x43,0xed,0xcf,0xac,0x62,
    0xe4,0xb3,0x1c,0xa9,0xc9,0x08,0xe8,0x95,0x80,0xdf,0x94,0xfa,0x75,0x8f,0x3f,0xa6,
    0x47,0x07,0xa7,0xfc,0xf3,0x73,0x17,0xba,0x83,0x59,0x3c,0x19,0xe6,0x85,0x4f,0xa8,
    0x68,0x6b,0x81,0xb2,0x71,0x64,0xda,0x8b,0xf8,0xeb,0x0f,0x4b,0x70,0x56,0x9d,0x35,
    0x1e,0x24,0x0e,0x5e,0x63,0x58,0xd1,0xa2,0x25,0x22,0x7c,0x3b,0x01,0x21,0x78,0x87,
    0xd4,0x00,0x46,0x57,0x9f,0xd3,0x27,0x52,0x4c,0x36,0x02,0xe7,0xa0,0xc4,0xc8,0x9e,
    0xea,0xbf,0x8a,0xd2,0x40,0xc7,0x38,0xb5,0xa3,0xf7,0xf2,0xce,0xf9,0x61,0x15,0xa1,
    0xe0,0xae,0x5d,0xa4,0x9b,0x34,0x1a,0x55,0xad,0x93,0x32,0x30,0xf5,0x8c,0xb1,0xe3,
    0x1d,0xf6,0xe2,0x2e,0x82,0x66,0xca,0x60,0xc0,0x29,0x23,0xab,0x0d,0x53,0x4e,0x6f,
    0xd5,0xdb,0x37,0x45,0xde,0xfd,0x8e,0x2f,0x03,0xff,0x6a,0x72,0x6d,0x6c,0x5b,0x51,
    0x8d,0x1b,0xaf,0x92,0xbb,0xdd,0xbc,0x7f,0x11,0xd9,0x5c,0x41,0x1f,0x10,0x5a,0xd8,
    0x0a,0xc1,0x31,0x88,0xa5,0xcd,0x7b,0xbd,0x2d,0x74,0xd0,0x12,0xb8,0xe5,0xb4,0xb0,
    0x89,0x69,0x97,0x4a,0x0c,0x96,0x77,0x7e,0x65,0xb9,0xf1,0x09,0xc5,0x6e,0xc6,0x84,
    0x18,0xf0,0x7d,0xec,0x3a,0xdc,0x4d,0x20,0x79,0xee,0x5f,0x3e,0xd7,0xcb,0x39,0x48
];

var _sm4Fk = [0xa3b1bac6, 0x56aa3350, 0x677d9197, 0xb27022dc];

var _sm4Ck = [
    0x00070e15,0x1c232a31,0x383f464d,0x545b6269,0x70777e85,0x8c939aa1,0xa8afb6bd,0xc4cbd2d9,
    0xe0e7eef5,0xfc030a11,0x181f262d,0x343b4249,0x50575e65,0x6c737a81,0x888f969d,0xa4abb2b9,
    0xc0c7ced5,0xdce3eaf1,0xf8ff060d,0x141b2229,0x30373e45,0x4c535a61,0x686f767d,0x848b9299,
    0xa0a7aeb5,0xbcc3cad1,0xd8dfe6ed,0xf4fb0209,0x10171e25,0x2c333a41,0x484f565d,0x646b7279
];

function _sm4Rotl(x, n) { return ((x << n) | (x >>> (32 - n))) >>> 0; }

function _sm4Tau(a) {
    return ((_sm4Sbox[(a >>> 24) & 0xff] << 24) |
            (_sm4Sbox[(a >>> 16) & 0xff] << 16) |
            (_sm4Sbox[(a >>> 8) & 0xff] << 8) |
            (_sm4Sbox[a & 0xff])) >>> 0;
}

function _sm4L(b) { return (b ^ _sm4Rotl(b, 2) ^ _sm4Rotl(b, 10) ^ _sm4Rotl(b, 18) ^ _sm4Rotl(b, 24)) >>> 0; }
function _sm4L2(b) { return (b ^ _sm4Rotl(b, 13) ^ _sm4Rotl(b, 23)) >>> 0; }
function _sm4T(x) { return _sm4L(_sm4Tau(x)); }
function _sm4T2(x) { return _sm4L2(_sm4Tau(x)); }

function _sm4KeySchedule(keyBytes) {
    var mk = [];
    for (var i = 0; i < 4; i++) {
        mk[i] = (keyBytes[i*4] << 24) | (keyBytes[i*4+1] << 16) | (keyBytes[i*4+2] << 8) | keyBytes[i*4+3];
    }
    var k = [];
    for (var i = 0; i < 4; i++) k[i] = (mk[i] ^ _sm4Fk[i]) >>> 0;
    var rk = [];
    for (var i = 0; i < 32; i++) {
        var x = (k[i+1] ^ k[i+2] ^ k[i+3] ^ _sm4Ck[i]) >>> 0;
        k[i+4] = (k[i] ^ _sm4T2(x)) >>> 0;
        rk[i] = k[i+4];
    }
    return rk;
}

function _sm4EncBlock(x, rk) {
    for (var i = 0; i < 32; i++) {
        var t = (x[1] ^ x[2] ^ x[3] ^ rk[i]) >>> 0;
        x.push((x[0] ^ _sm4T(t)) >>> 0);
        x.shift();
    }
    return [x[3], x[2], x[1], x[0]];
}

function _sm4DecBlock(x, rk) {
    for (var i = 31; i >= 0; i--) {
        var t = (x[1] ^ x[2] ^ x[3] ^ rk[i]) >>> 0;
        x.push((x[0] ^ _sm4T(t)) >>> 0);
        x.shift();
    }
    return [x[3], x[2], x[1], x[0]];
}

function _sm4WordsFromHex(hex) {
    var w = [];
    for (var i = 0; i < hex.length; i += 8) w.push(parseInt(hex.substr(i, 8), 16));
    return w;
}

function _sm4WordsToHex(w) {
    return w.map(function(x) { return (x >>> 0).toString(16).padStart(8, '0'); }).join('');
}

function _sm4Xor(a, b) {
    return [a[0]^b[0], a[1]^b[1], a[2]^b[2], a[3]^b[3]].map(function(x) { return x >>> 0; });
}

function _sm4IncCtr(ctr) {
    var r = [ctr[0], ctr[1], ctr[2], ctr[3]];
    for (var i = 3; i >= 0; i--) {
        r[i] = (r[i] + 1) >>> 0;
        if (r[i] !== 0) break;
    }
    return r;
}

function _sm4DecryptRaw(cipherHex, keyHex, mode, hasPadding, ivHex) {
    var rk = _sm4KeySchedule(hexToBytes(keyHex));
    var cipherWords = _sm4WordsFromHex(cipherHex);
    var numBlocks = cipherWords.length / 4;
    var result = [];
    var ivWords = ivHex ? _sm4WordsFromHex(ivHex) : null;
    var i, block, dec, plain;

    if (mode === 'ecb') {
        for (i = 0; i < numBlocks; i++) {
            block = cipherWords.slice(i*4, i*4+4);
            dec = _sm4DecBlock(block.slice(), rk);
            result.push.apply(result, dec);
        }
    } else if (mode === 'cbc') {
        var prev = ivWords;
        for (i = 0; i < numBlocks; i++) {
            block = cipherWords.slice(i*4, i*4+4);
            dec = _sm4DecBlock(block.slice(), rk);
            plain = _sm4Xor(dec, prev);
            result.push.apply(result, plain);
            prev = block;
        }
    } else if (mode === 'cfb') {
        var sr = ivWords;
        for (i = 0; i < numBlocks; i++) {
            block = cipherWords.slice(i*4, i*4+4);
            var enc = _sm4EncBlock(sr.slice(), rk);
            plain = _sm4Xor(block, enc);
            result.push.apply(result, plain);
            sr = block;
        }
    } else if (mode === 'ofb') {
        var ofbSr = ivWords;
        for (i = 0; i < numBlocks; i++) {
            ofbSr = _sm4EncBlock(ofbSr.slice(), rk);
            block = cipherWords.slice(i*4, i*4+4);
            plain = _sm4Xor(block, ofbSr);
            result.push.apply(result, plain);
        }
    } else if (mode === 'ctr') {
        var ctr = ivWords;
        for (i = 0; i < numBlocks; i++) {
            var keystream = _sm4EncBlock(ctr.slice(), rk);
            block = cipherWords.slice(i*4, i*4+4);
            plain = _sm4Xor(block, keystream);
            result.push.apply(result, plain);
            ctr = _sm4IncCtr(ctr);
        }
    }

    var hex = _sm4WordsToHex(result);

    if (hasPadding && hex.length >= 2) {
        var lastByte = parseInt(hex.substr(hex.length - 2, 2), 16);
        if (lastByte > 0 && lastByte <= 16 && lastByte * 2 <= hex.length) {
            var valid = true;
            for (var j = hex.length - lastByte * 2; j < hex.length; j += 2) {
                if (parseInt(hex.substr(j, 2), 16) !== lastByte) { valid = false; break; }
            }
            if (valid) hex = hex.substr(0, hex.length - lastByte * 2);
        }
    }

    return hex;
}

function _sm4EncryptRaw(plainHex, keyHex, mode, hasPadding, ivHex) {
    if (hasPadding) {
        var plainBytes = hexToBytes(plainHex);
        var padLen = 16 - (plainBytes.length % 16);
        if (padLen === 0) padLen = 16;
        for (var p = 0; p < padLen; p++) plainHex += padLen.toString(16).padStart(2, '0');
    }
    var rk = _sm4KeySchedule(hexToBytes(keyHex));
    var plainWords = _sm4WordsFromHex(plainHex);
    var numBlocks = plainWords.length / 4;
    var result = [];
    var ivWords = ivHex ? _sm4WordsFromHex(ivHex) : null;
    var i, block, enc, cipher;
    if (mode === 'ecb') {
        for (i = 0; i < numBlocks; i++) {
            block = plainWords.slice(i*4, i*4+4);
            cipher = _sm4EncBlock(block.slice(), rk);
            result.push.apply(result, cipher);
        }
    } else if (mode === 'cbc') {
        var prev = ivWords;
        for (i = 0; i < numBlocks; i++) {
            block = plainWords.slice(i*4, i*4+4);
            cipher = _sm4EncBlock(_sm4Xor(block, prev).slice(), rk);
            result.push.apply(result, cipher);
            prev = cipher;
        }
    } else if (mode === 'cfb') {
        var sr = ivWords;
        for (i = 0; i < numBlocks; i++) {
            block = plainWords.slice(i*4, i*4+4);
            enc = _sm4EncBlock(sr.slice(), rk);
            cipher = _sm4Xor(block, enc);
            result.push.apply(result, cipher);
            sr = cipher;
        }
    } else if (mode === 'ofb') {
        var ofbSr = ivWords;
        for (i = 0; i < numBlocks; i++) {
            ofbSr = _sm4EncBlock(ofbSr.slice(), rk);
            block = plainWords.slice(i*4, i*4+4);
            cipher = _sm4Xor(block, ofbSr);
            result.push.apply(result, cipher);
        }
    } else if (mode === 'ctr') {
        var ctr = ivWords;
        for (i = 0; i < numBlocks; i++) {
            var keystream = _sm4EncBlock(ctr.slice(), rk);
            block = plainWords.slice(i*4, i*4+4);
            cipher = _sm4Xor(block, keystream);
            result.push.apply(result, cipher);
            ctr = _sm4IncCtr(ctr);
        }
    }
    return _sm4WordsToHex(result);
}

async function doSm4Enc() {
    const r = document.getElementById('sm4Result');
    r.innerText = '\u23f3 加密中...';
    try {
        const mode = document.getElementById('sm4Mode').value;
        const padding = document.getElementById('sm4Padding').value;
        const inputMode = document.getElementById('sm4InputMode').value;
        const key = document.getElementById('sm4Key').value.trim();
        const val = document.getElementById('sm4Input').value.trim();

        if (!/^[0-9a-fA-F]{32}$/.test(key)) throw new Error('密钥必须为 32 位 HEX');

        const iv = (mode !== 'ecb') ? document.getElementById('sm4Iv').value.trim() : '';
        if (mode !== 'ecb' && !/^[0-9a-fA-F]{32}$/.test(iv)) throw new Error('IV 必须为 32 位 HEX');

        let plainHex;
        if (inputMode === 'utf8') {
            plainHex = _utf8ToHex(val);
        } else if (inputMode === 'hex') {
            plainHex = val;
            if (padding === 'none' && plainHex.length % 32 !== 0) {
                throw new Error('None 填充模式下，HEX 明文长度必须是 32 的倍数 (16 字节对齐)，当前 ' + plainHex.length + ' 位');
            }
        } else if (inputMode === 'base64') {
            plainHex = bytesToHex(base64ToBytes(val));
        } else if (inputMode === 'file') {
            const f = document.getElementById('sm4FileInput').files[0];
            if (!f) throw new Error('请选择二进制文件');
            const data = await readFileAsUint8Array(f);
            plainHex = bytesToHex(data);
            if (padding === 'none' && plainHex.length % 32 !== 0) {
                throw new Error('None 填充模式下，文件大小必须是 16 字节的倍数，当前 ' + data.length + ' 字节');
            }
        }

        const cipher = _sm4EncryptRaw(plainHex, key, mode, padding !== 'none', iv);
        sm4BinaryResult = hexToBytes(cipher);
        const padNote = padding === 'none' ? '\n(无填充)' : '\n(PKCS#7 填充)';
        r.innerText = 'HEX: ' + cipher + '\nBase64: ' + _hexToBase64(cipher) + padNote;
    } catch(e) {
        r.innerText = '\u274c 加密失败：' + e.message;
    }
}

async function doSm4Dec() {
    const r = document.getElementById('sm4Result');
    r.innerText = '\u23f3 解密中...';
    try {
        const mode = document.getElementById('sm4Mode').value;
        const padding = document.getElementById('sm4Padding').value;
        const inputMode = document.getElementById('sm4InputMode').value;
        const key = document.getElementById('sm4Key').value.trim();
        const val = document.getElementById('sm4Input').value.trim();

        if (!/^[0-9a-fA-F]{32}$/.test(key)) throw new Error('密钥必须为 32 位 HEX');

        let cipherHex;
        if (inputMode === 'hex') {
            cipherHex = val;
            if (padding === 'none' && cipherHex.length % 32 !== 0) {
                throw new Error('None 填充模式下，HEX 密文长度必须是 32 的倍数 (16 字节对齐)，当前 ' + cipherHex.length + ' 位');
            }
        } else if (inputMode === 'base64') {
            cipherHex = _base64ToHex(val);
        } else if (inputMode === 'file') {
            const f = document.getElementById('sm4FileInput').files[0];
            if (!f) throw new Error('请选择二进制文件');
            const data = await readFileAsUint8Array(f);
            cipherHex = bytesToHex(data);
            if (padding === 'none' && cipherHex.length % 32 !== 0) {
                throw new Error('None 填充模式下，密文文件大小必须是 16 字节的倍数，当前 ' + data.length + ' 字节');
            }
        } else {
            throw new Error('密文请使用 HEX / Base64 / 文件模式输入');
        }

        const iv = (mode !== 'ecb') ? document.getElementById('sm4Iv').value.trim() : '';
        if (mode !== 'ecb' && !/^[0-9a-fA-F]{32}$/.test(iv)) throw new Error('IV 必须为 32 位 HEX');

        const rawHex = _sm4DecryptRaw(cipherHex, key, mode, padding !== 'none', iv);
        sm4BinaryResult = hexToBytes(rawHex);

        var utf8Display;
        try {
            utf8Display = bytesToUtf8(hexToBytes(rawHex));
        } catch(e) {
            utf8Display = '（无法解码为 UTF-8 文本）';
        }

        const padNote = padding === 'none' ? '\n(无填充)' : '\n(PKCS#7 填充)';
        r.innerText = 'HEX: ' + rawHex + '\nUTF-8: ' + utf8Display + padNote;
    } catch(e) {
        r.innerText = '\u274c 解密失败：' + e.message;
    }
}

function downloadSm4Bin(filename) {
    if (!sm4BinaryResult) {
        document.getElementById('sm4Result').innerText = '\u274c 请先执行加密/解密';
        return;
    }
    const blob = new Blob([sm4BinaryResult], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}
</script>
